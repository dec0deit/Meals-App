version: 2
updates:
  - package-ecosystem: gradle
    directory: /android/app
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      interval: weekly
